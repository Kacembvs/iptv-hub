<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPTV v7.0</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IPTV">
<style>
:root{--bg:#0e1014;--cd:#1a1d25;--tx:#f1f2f5;--mu:#98a0ad;--ac:#e5484d;--bd:#2a2e39}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:11px;background:var(--cd);color:var(--tx);width:100%;margin-top:8px}
button{background:var(--ac);border:0;color:#fff;font-weight:600}
button.s{background:var(--bd);color:var(--tx)}
#setup{padding:16px;max-width:520px;margin:auto}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:14px}
h1{font-size:22px;margin:8px 0}h2{font-size:15px;margin:0}h3{margin:14px 0 4px;font-size:15px}
#msg{color:var(--ac);font-size:14px;margin-top:10px;white-space:pre-wrap}
#pl{position:sticky;top:0;z-index:5;background:#000}
#v{width:100%;max-height:45vh;background:#000;display:block}
#pt{padding:6px 12px;font-size:13px;color:#ddd;display:flex;gap:8px}
#pt span{flex:1}#pt b{cursor:pointer;padding:0 8px}
#pt a{color:#fff;background:#e5484d;border-radius:8px;padding:4px 12px;text-decoration:none;font-weight:600;font-size:13px}
#app{padding:0 10px 30px}
.bar{display:flex;gap:6px;margin-top:10px}.bar button{margin:0;padding:9px 4px;background:var(--cd);color:var(--mu);border:1px solid var(--bd)}
.bar button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:6px}.row>*{flex:1}.row>button{flex:0 0 52px}
#cnt{color:var(--mu);font-size:12px;margin:8px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.c{cursor:pointer}.c .i{background:var(--cd);border-radius:10px;overflow:hidden;aspect-ratio:2/3;border:1px solid var(--bd)}
.c.live .i{aspect-ratio:1/1}.c.live img{object-fit:contain;padding:10px}
.c img{width:100%;height:100%;object-fit:cover;display:block}
.c p{margin:5px 2px 0;font-size:12px;line-height:1.25;max-height:2.5em;overflow:hidden}
.ep{padding:12px;background:var(--cd);border:1px solid var(--bd);border-radius:10px;margin-top:6px;cursor:pointer}
.more{margin-top:14px}



/* ---------- V4 : accueil et style cinema ---------- */
:root{--ac:#e50914;--bg:#080a0d;--cd:#15181e;--bd:#292d35}
body{background:linear-gradient(180deg,#07080b 0,#0e1014 420px);min-height:100vh}
#app{max-width:1500px;margin:auto}.bar{position:sticky;top:0;z-index:8;padding:10px 0;background:rgba(8,10,13,.9);backdrop-filter:blur(16px)}
.bar button{border-radius:999px}.bar button.on{box-shadow:0 5px 20px rgba(229,9,20,.28)}
#q{background:rgba(21,24,30,.9);border-radius:999px;padding-left:16px}
.c{position:relative;transition:transform .18s ease}.c:hover{transform:translateY(-4px)}.c .i{background:linear-gradient(135deg,#252933,#12151a)}
.c:hover .i{border-color:#59606d;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.fav{position:absolute;right:7px;top:7px;z-index:2;width:34px;height:34px;margin:0;padding:0;border-radius:50%;display:grid;place-items:center;background:rgba(5,5,7,.72);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:18px;backdrop-filter:blur(8px)}
.fav.on{background:var(--ac);border-color:var(--ac)}
.home{padding-bottom:35px}.home-hero{position:relative;min-height:330px;border-radius:22px;overflow:hidden;background:#181b21;margin:12px 0 24px;display:flex;align-items:flex-end;isolation:isolate}
.home-hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.52);z-index:-2}.home-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,13,.96),rgba(8,10,13,.38) 60%,rgba(8,10,13,.7)),linear-gradient(0deg,#080a0d,transparent 55%);z-index:-1}
.home-copy{padding:32px;max-width:660px}.home-kicker{color:#fff;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.home-copy h1{font-size:clamp(30px,6vw,62px);line-height:.98;margin:10px 0}.home-copy p{max-width:560px;color:#d0d2d8;line-height:1.5}.hero-actions{display:flex;gap:9px;flex-wrap:wrap}.hero-actions button{width:auto;padding:10px 18px}
.home-section{margin:24px 0}.home-section-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.home-section-head h2{font-size:21px;flex:1}.home-section-head span{color:var(--mu);font-size:12px}
.home-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}.home-empty{padding:28px;border:1px dashed var(--bd);border-radius:15px;color:var(--mu);text-align:center;background:rgba(21,24,30,.55)}
@media(max-width:720px){.bar{top:0;margin-left:-8px;margin-right:-8px;padding:8px;overflow:auto}.bar button{white-space:nowrap}.home-hero{min-height:350px;border-radius:15px;margin-top:8px}.home-copy{padding:22px 18px}.home-copy h1{font-size:36px}.home-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.home-section-head h2{font-size:18px}}
@media(max-width:390px){.home-row{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- V3 : navigation IPTV master/detail ---------- */
.browser{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start;margin-top:10px}
.groups{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:8px}
.groups-title{font-size:12px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:8px 10px}
.group-btn{display:flex;align-items:center;gap:8px;width:100%;margin:2px 0;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--tx);font-weight:500;text-align:left}
.group-btn span:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-btn .badge{flex:0 0 auto;color:var(--mu);font-size:11px;background:var(--bg);border-radius:999px;padding:2px 7px}
.group-btn.on{background:var(--ac);color:#fff}.group-btn.on .badge{background:rgba(255,255,255,.2);color:#fff}
.catalog{min-width:0}.catalog-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}.catalog-head h2{font-size:18px;flex:1}.catalog-head #cnt{margin:0}
#mobileGroup{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px}.c .i{border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.12)}.c p{font-size:13px;font-weight:600;max-height:2.6em}
@media(min-width:1100px){.browser{grid-template-columns:260px minmax(0,1fr)}.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}}
@media(max-width:720px){#app{padding:0 8px 24px}.browser{display:block}.groups{display:none;position:static;max-height:none}.groups.open{display:block;margin-bottom:10px}.catalog-head{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0}.catalog-head h2{font-size:15px}#mobileGroup{display:block;width:auto;margin:0;padding:8px 11px;background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.c p{font-size:12px}.c .i{border-radius:10px}}
@media(max-width:390px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

  /* ---------- V2 : fiche serie ---------- */
  .series-view{max-width:980px;margin:0 auto;padding-bottom:24px}
  .series-back{width:auto;margin:4px 0 14px;padding:9px 14px}
  .series-hero{display:grid;grid-template-columns:minmax(130px,220px) 1fr;gap:18px;align-items:start;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px}
  .series-poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--bd)}
  .series-info h2{font-size:24px;margin:0 0 7px}
  .series-meta{color:var(--mu);font-size:13px;line-height:1.6;margin-bottom:8px}
  .series-plot{line-height:1.55;margin:8px 0;white-space:pre-line}
  .series-cast{font-size:13px;color:var(--mu);margin-top:9px}
  .series-tools{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:8px;margin:14px 0 8px}
  .series-tools select,.series-tools input{margin:0}
  .series-summary{color:var(--mu);font-size:12px;margin:8px 2px}
  .episode-list{display:grid;gap:8px}
  .episode-card{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;padding:10px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;cursor:pointer}
  .episode-card:hover{border-color:var(--ac)}
  .episode-thumb{width:88px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--bd)}
  .episode-title{font-weight:650;font-size:14px}
  .episode-meta{color:var(--mu);font-size:12px;margin-top:4px}
  .episode-play{color:#fff;background:var(--ac);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;font-size:14px}
  .series-empty{padding:24px;text-align:center;color:var(--mu);background:var(--cd);border-radius:12px}
  @media(max-width:620px){.series-hero{grid-template-columns:105px 1fr;gap:12px}.series-info h2{font-size:20px}.series-plot{grid-column:1/-1}.series-tools{grid-template-columns:1fr}.episode-card{grid-template-columns:76px 1fr auto}.episode-thumb{width:76px}.series-cast{display:none}}

/* V4.1 iOS contrast fix: application always uses its own dark palette */
html{color-scheme:dark;background:#080a0d}
:root{--ac:#e50914;--bg:#080a0d;--cd:#15181e;--tx:#f5f5f7;--mu:#a9adb7;--bd:#343944}
body,#app,#setup,#main{color:var(--tx)}
input,select,textarea{color:#f5f5f7!important;background:#15181e!important;border-color:#343944!important;-webkit-text-fill-color:#f5f5f7!important;caret-color:#fff!important;opacity:1!important}
input::placeholder,textarea::placeholder{color:#a9adb7!important;opacity:1!important;-webkit-text-fill-color:#a9adb7!important}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:#f5f5f7!important;box-shadow:0 0 0 1000px #15181e inset!important;caret-color:#fff!important}
.groups,.catalog,.catalog-head,.group-btn,.group-btn span,.c,.c p,#cnt,#groupTitle{color:var(--tx)}
.group-btn .badge,#cnt{color:var(--mu)}
.grid{display:grid!important;visibility:visible!important;opacity:1!important}
.c{display:block!important;visibility:visible!important;opacity:1!important;min-width:0}
.c .i{display:block;min-height:120px;background:#1b1f27}
.c .i img{display:block;width:100%;height:100%;object-fit:cover}


/* V4.2 mobile groups drawer fix */
@media(max-width:720px){
  .browser{display:block!important}
  .groups{display:none!important;position:relative!important;max-height:58vh!important;overflow:auto!important;margin-bottom:12px!important;-webkit-overflow-scrolling:touch}
  .groups.open{display:block!important}
  .catalog{display:block!important;min-height:240px!important}
  .catalog-head[hidden],.groups[hidden]{display:none!important}
  #grid{display:grid!important;min-height:180px!important}
  #grid.home{display:block!important}
}


/* V4.3 robust catalogue cards */
#grid.grid{width:100%!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important;align-items:start!important}
#grid.grid>.c{position:relative!important;display:block!important;width:auto!important;min-height:170px!important;color:#f5f5f7!important;background:transparent!important}
#grid.grid>.c>.i{display:block!important;width:100%!important;aspect-ratio:2/3!important;min-height:135px!important;border:1px solid #343944!important;border-radius:12px!important;background:linear-gradient(135deg,#252933,#15181e)!important;overflow:hidden!important}
#grid.grid>.c.live>.i{aspect-ratio:1/1!important}
#grid.grid>.c>.i>img{display:block;width:100%!important;height:100%!important;object-fit:cover!important}
#grid.grid>.c.live>.i>img{object-fit:contain!important;padding:8px!important;box-sizing:border-box!important}
#grid.grid>.c>p{display:block!important;color:#f5f5f7!important;margin:6px 2px 0!important;min-height:2.5em!important;font-size:12px!important;line-height:1.25!important;overflow:hidden!important}
.fallback-card,.catalog-empty{min-height:90px;padding:12px;color:#f5f5f7;background:#15181e;border:1px solid #343944;border-radius:12px;text-align:left}
.catalog-empty{grid-column:1/-1;text-align:center}
@media(max-width:390px){#grid.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}


/* V5 direct downloads */
.download-btn{position:absolute;left:7px;top:7px;z-index:3;width:36px;height:36px;margin:0;padding:0;border-radius:50%;display:grid;place-items:center;background:rgba(5,5,7,.78);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:17px;backdrop-filter:blur(8px)}
.download-btn:active{background:var(--ac)}
.episode-actions{display:flex;gap:7px;align-items:center}.episode-download{width:36px;height:36px;margin:0;padding:0;border-radius:50%;display:grid;place-items:center;background:#252933;color:#fff;border:1px solid #454b57;font-size:16px}.episode-download:active{background:var(--ac)}
.download-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:1000;max-width:min(90vw,520px);padding:11px 15px;border-radius:12px;background:#f5f5f7;color:#111319;box-shadow:0 12px 38px rgba(0,0,0,.45);font-weight:650;text-align:center}


/* V5.1 iOS: do not use download= for cross-origin IPTV URLs, which can create 0-byte files */


/* V5.2 Documents by Readdle: same-page navigation for direct media URLs */

.prow{display:flex;gap:6px;margin-top:8px}.prow button{flex:1;margin:0}

/* ========== V7 : interface type TiviMate ========== */
:root{--ac:#2f6fed;--bg:#0a0e17;--cd:#121828;--bd:#252d42}
html{background:#0a0e17}body{background:linear-gradient(180deg,#0a0e17,#0d1322 420px)}
#pt a{background:var(--ac)}.bar button.on{box-shadow:0 5px 20px rgba(47,111,237,.35)}
.c:focus-visible,.group-btn:focus-visible,.episode-card:focus-visible{outline:3px solid #fff;outline-offset:2px}
.c,.episode-card{content-visibility:auto;contain-intrinsic-size:auto 220px}
.pg{height:3px;background:#2b334a;border-radius:3px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ac);width:0}
.i{position:relative}.i .pg{position:absolute;left:0;right:0;bottom:0;border-radius:0;height:4px}
/* Live TV en liste + EPG */
#grid.grid:has(>.c.live){grid-template-columns:1fr!important;gap:6px!important}
@media(min-width:900px){#grid.grid:has(>.c.live){grid-template-columns:repeat(2,minmax(0,1fr))!important}}
#grid.grid>.c.lr{display:flex!important;align-items:center;gap:12px;min-height:68px!important;padding:8px 12px;background:var(--cd)!important;border:1px solid var(--bd);border-radius:12px;transform:none;contain-intrinsic-size:auto 72px}
#grid.grid>.c.lr.cur,#grid.grid>.c.lr:focus-visible{background:rgba(47,111,237,.25)!important;border-color:var(--ac)}
.lr .no{width:30px;text-align:right;color:var(--mu);font-size:13px;flex:none}
.lr .lg{width:56px;height:56px;flex:none;border-radius:10px;background:#0a0e17;display:grid;place-items:center;overflow:hidden}.lr .lg img{width:100%;height:100%;object-fit:contain;padding:6px}
.lr .lt{flex:1;min-width:0}.lr .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .now,.lr .nxt{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr .now{color:var(--tx);margin-top:2px}.lr .pg{margin:5px 0 3px}
.lr .fav{position:static;flex:none}
#epgp{padding:8px 12px;font-size:13px;max-height:22vh;overflow:auto;color:#ddd}
.eg{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--bd)}.eg time{color:var(--mu);flex:none}.eg.now{color:#fff;font-weight:700}
/* fiches films / séries modernes */
.sheet{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:16px;background:rgba(4,6,12,.82);backdrop-filter:blur(8px)}
.sheet-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(24px) brightness(.35);transform:scale(1.2);z-index:0}
.sheet-box{position:relative;z-index:1;display:grid;grid-template-columns:minmax(120px,240px) 1fr;gap:20px;max-width:880px;width:100%;max-height:92vh;overflow:auto;background:rgba(18,24,40,.92);border:1px solid var(--bd);border-radius:20px;padding:18px}
.sheet-poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:14px;background:var(--bd)}
.sheet-info h2{font-size:26px;margin:0 0 8px}
.sheet-x{position:absolute;z-index:2;right:22px;top:22px;width:38px;height:38px;border-radius:50%;padding:0;margin:0}
@media(max-width:620px){.sheet-box{grid-template-columns:100px 1fr;gap:12px}.sheet-info h2{font-size:20px}}
.series-hero.modern{position:relative;overflow:hidden;isolation:isolate;border-radius:20px;padding:20px}
.series-hero.modern>*:not(.sheet-bg){position:relative;z-index:1}.series-hero.modern .series-info h2{font-size:30px}
.episode-card{border-radius:14px}.episode-card:hover,.episode-card:focus-visible{border-color:var(--ac);background:#182038}
/* mode paysage dédié : liste à gauche, lecteur à droite */
@media(orientation:landscape) and (min-width:700px){
#main:not([hidden]){display:grid;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh}
#main:has(#pl:not([hidden])){grid-template-columns:minmax(0,1fr) minmax(300px,42%)}
#app{grid-column:1;grid-row:1;overflow:auto;height:100%;padding-bottom:20px;-webkit-overflow-scrolling:touch}
#pl{grid-column:2;grid-row:1;position:relative;display:flex;flex-direction:column;height:100%;overflow:auto;border-left:1px solid var(--bd)}
#pl[hidden]{display:none}
#v{max-height:none;flex:none;aspect-ratio:16/9;width:100%}
.browser{grid-template-columns:minmax(150px,200px) minmax(0,1fr)}.groups{max-height:calc(100vh - 80px)}
#grid.grid:has(>.c.live){grid-template-columns:1fr!important}.home-hero{min-height:200px}}
</style>
</head>
<body>

<div id="setup">
<h1>📺 Mes profils</h1>
<div id="plist"></div>
<div class="box" id="pform">
<h2 id="pftitle">Ajouter une source</h2>
<input id="pn" placeholder="Nom (ex. Maison, Sport…)">
<select id="ptype" onchange="togType()"><option value="xtream">Xtream (serveur + identifiant)</option><option value="m3u-url">Lien M3U</option></select>
<div id="boxX">
<input id="xs" placeholder="Serveur : http://exemple.com:8080" inputmode="url" autocapitalize="off">
<input id="xu" placeholder="Utilisateur" autocapitalize="off">
<div style="position:relative"><input id="xp" placeholder="Mot de passe" type="password" style="padding-right:96px"><button type="button" onclick="togPw(this)" style="position:absolute;right:6px;top:15px;width:auto;margin:0;padding:6px 12px;background:#343944;font-size:13px">Afficher</button></div>
</div>
<div id="boxU" hidden><input id="mu" placeholder="http://…/get.php?…&type=m3u_plus" inputmode="url" autocapitalize="off"></div>
<div class="prow"><button onclick="saveProfile()">Enregistrer et se connecter</button><button class="s" onclick="resetForm()">Annuler</button></div>
</div>
<div class="box">
<h2>Fichier M3U (usage unique, non enregistré)</h2>
<input id="mf" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl,*/*">
</div>
<div class="box"><button class="s" style="margin:0" onclick="sure(this,wipe)">Effacer toutes les données locales</button></div>
<div id="msg"></div>
</div>

<div id="main" hidden>
<div id="pl" hidden>
<video id="v" controls playsinline autoplay></video>
<div id="pt"><span id="ptt"></span><a id="vlc" href="#" onclick="releasePlayer()">Ouvrir dans VLC</a><b onclick="stop()">✕</b></div>
</div>
<div id="app">
<div class="bar" id="tabs">
<button data-t="home" class="on">Accueil</button>
<button data-t="live">Chaînes</button>
<button data-t="vod">Films</button>
<button data-t="ser">Séries</button>
<button data-t="fav">♥ Favoris</button>
<button class="s" style="flex:0 0 48px" onclick="showSetup()" title="Profils">⚙</button>
</div>
<input id="q" type="search" placeholder="Rechercher dans le catalogue…" oninput="lim=60;render()">
<select id="cat" hidden onchange="cat=this.value;lim=60;render()"></select>
<div class="browser">
  <aside id="groups" class="groups" aria-label="Groupes et catégories"></aside>
  <section class="catalog">
    <div class="catalog-head"><button id="mobileGroup" type="button" aria-expanded="false">☰ Choisir un groupe</button><h2 id="groupTitle">Tous les groupes</h2><div id="cnt"></div></div>
    <div id="grid" class="grid"></div>
  </section>
</div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>

/* ---------- M3U ---------- */
function parseM3U(t){
  const o={live:[],vod:[],ser:[]};let cur=null;
  for(const raw of t.split(/\r?\n/)){
    const l=raw.trim();
    if(l.startsWith('#EXTINF')){
      const a=k=>(l.match(new RegExp(k+'="([^"]*)"','i'))||[])[1]||'';
      cur={name:l.slice(l.lastIndexOf(',')+1).trim()||a('tvg-name')||'Sans nom',img:a('tvg-logo'),cat:a('group-title')||'Divers'};
    }else if(cur&&/^(https?|rtmp):/i.test(l)){
      const isV=/\/movie\//.test(l),isS=/\/series\//.test(l);
      cur.url=(isV||isS)?l:l.replace(/^(https?:\/\/[^/]+)\/(?:live\/)?([^/]+)\/([^/]+)\/(\d+)(?:\.ts)?$/,'$1/live/$2/$3/$4.m3u8');
      (isV?o.vod:isS?o.ser:o.live).push(cur);cur=null;
    }
  }
  return o;
}
function episodeParts(name){
  let n=String(name||'').trim(),season=1,episode=0;
  const patterns=[/\bS(\d{1,2})[ ._-]*E(\d{1,3})\b/i,/\b(\d{1,2})x(\d{1,3})\b/i,/\bSaison[ ._-]*(\d{1,2}).*?(?:Episode|Ep)[ ._-]*(\d{1,3})\b/i];
  let m=null;for(const r of patterns){m=n.match(r);if(m)break}
  if(m){season=Number(m[1])||1;episode=Number(m[2])||0}
  else {const sm=n.match(/\bS(?:aison)?[ ._-]*(\d{1,2})\b/i);if(sm)season=Number(sm[1])||1}
  let base=n.replace(/\bS\d{1,2}[ ._-]*E\d{1,3}\b/ig,'').replace(/\b\d{1,2}x\d{1,3}\b/ig,'').replace(/\bS(?:aison)?[ ._-]*\d{1,2}\b/ig,'').replace(/\b(?:Episode|Ep)[ ._-]*\d{1,3}\b/ig,'').replace(/[._-]+$/g,'').trim();
  return {base:base||n,season,episode};
}
function groupM3USeries(items){
  const groups=new Map();
  items.forEach((it,index)=>{
    const x=episodeParts(it.name),key=(it.cat+'|'+x.base).toLocaleLowerCase();
    if(!groups.has(key))groups.set(key,{name:x.base,img:it.img,cat:it.cat,m3u:true,episodes:[]});
    const g=groups.get(key);if(!g.img&&it.img)g.img=it.img;
    g.episodes.push({...it,season:x.season,episode:x.episode||g.episodes.filter(e=>e.season===x.season).length+1,originalIndex:index});
  });
  return [...groups.values()].map(g=>{g.episodes.sort((a,b)=>a.season-b.season||a.episode-b.episode||a.originalIndex-b.originalIndex);return g});
}
function fromText(t){
  const o=parseM3U(t);
  if(!o.live.length&&!o.vod.length&&!o.ser.length){msg('Aucune entrée trouvée dans cette playlist.');return false}
  o.ser=groupM3USeries(o.ser);D=o;return true;
}

function safeFileName(name,ext){
  const base=String(name||'video').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,120)||'video';
  return base+(ext&& !base.toLowerCase().endsWith('.'+ext.toLowerCase())?'.'+ext:'');
}
function extensionFromUrl(url,fallback='mp4'){
  try{const p=new URL(url,location.href).pathname,m=p.match(/\.([a-z0-9]{2,5})$/i);return m?m[1].toLowerCase():fallback}catch(e){return fallback}
}

  toast(copied?'Lien copié. Ouverture dans Safari… sinon ouvre Safari et colle le lien.':'Ouverture dans Safari…');

function play(url,title){
  const v=$('#v');$('#pl').hidden=false;$('#ptt').textContent=title;$('#vlc').href='vlc-x-callback://x-callback-url/stream?url='+enc(url);
  if(hls){hls.destroy();hls=null}
  const native=v.canPlayType('application/vnd.apple.mpegurl');
  if(/\.m3u8(\?|$)/i.test(url)&&!native&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(v)}
  else v.src=url;
  v.onerror=()=>$('#ptt').textContent=title+' — lecture impossible ici : appuie sur « Ouvrir dans VLC »';
  v.play().catch(()=>{});
  scrollTo({top:0,behavior:'smooth'});
}
function releasePlayer(){const v=$('#v');v.pause();v.removeAttribute('src');v.load();if(hls){hls.destroy();hls=null}}
